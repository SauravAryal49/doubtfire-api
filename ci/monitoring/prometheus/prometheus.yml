global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Synthetic uptime / latency checks of the real API through nginx
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://ontrack-production/api/settings"]
        labels: { env: production }
      - targets: ["http://ontrack-staging/api/settings"]
        labels: { env: staging }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Request / connection metrics from production nginx
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels: { env: production }

  # Per-container CPU / memory / network
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
