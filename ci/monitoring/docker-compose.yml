# Monitoring & alerting stack for OnTrack (deployed by the Monitoring stage).
# Configs are baked into small images so this works when compose is driven
# from inside the Jenkins container.
# Needs: DISCORD_WEBHOOK_URL, GF_ADMIN_PASSWORD
name: ontrack-monitoring

services:
  prometheus:
    build: ./prometheus
    image: ontrack-prometheus:local
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes: [prometheus_data:/prometheus]
    networks: [ontrack-shared]

  alertmanager:
    build: ./alertmanager
    image: ontrack-alertmanager:local
    container_name: alertmanager
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    ports: ["9093:9093"]
    networks: [ontrack-shared]

  grafana:
    build: ./grafana
    image: ontrack-grafana:local
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/ontrack-overview.json
    ports: ["3000:3000"]
    volumes: [grafana_data:/var/lib/grafana]
    networks: [ontrack-shared]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox
    restart: unless-stopped
    networks: [ontrack-shared]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://ontrack-production:8080/stub_status"]
    networks: [ontrack-shared]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg"]
    command: ["--docker_only=true", "--housekeeping_interval=10s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [ontrack-shared]

networks:
  ontrack-shared:
    external: true
    name: ontrack-shared

volumes:
  prometheus_data:
  grafana_data:
