worker_processes auto;

events {
  worker_connections 1024;
}

http {
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time upstream=$upstream_response_time';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Basic DDoS / abuse protection: 20 req/s per client IP, short burst allowed.
  limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
  limit_req_status 429;

  upstream ontrack_api {
    server api:3000;
  }

  server {
    listen 80;
    client_max_body_size 50m;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      limit_req zone=perip burst=40 nodelay;
      proxy_pass http://ontrack_api;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }
  }

  # Metrics for nginx-prometheus-exporter. Only reachable from Docker networks.
  server {
    listen 8080;
    location = /stub_status {
      stub_status;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
    }
  }
}
