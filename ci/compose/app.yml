# OnTrack runtime stack - the SAME file is used for staging and production.
# Environment differences live only in ci/env/<env>.env (committed, non-secret)
# and the secrets file injected by Jenkins credentials.
#
# Required variables (exported by ci/scripts/deploy.sh):
#   ENV_NAME      staging | production
#   IMAGE         registry/ontrack-api:<tag>
#   SECRETS_FILE  path to the secrets env file (from Jenkins credentials)
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE}
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-2g}
    env_file:
      - ../env/${ENV_NAME}.env
      - ${SECRETS_FILE}
    environment:
      # Same DB wiring for whichever RAILS_ENV the env file selects
      DF_STAGING_DB_ADAPTER: mysql2
      DF_STAGING_DB_HOST: db
      DF_STAGING_DB_DATABASE: ${DB_NAME}
      DF_STAGING_DB_USERNAME: ${DB_USER}
      DF_STAGING_DB_PASSWORD: ${DB_PASSWORD}
      DF_PRODUCTION_DB_ADAPTER: mysql2
      DF_PRODUCTION_DB_HOST: db
      DF_PRODUCTION_DB_DATABASE: ${DB_NAME}
      DF_PRODUCTION_DB_USERNAME: ${DB_USER}
      DF_PRODUCTION_DB_PASSWORD: ${DB_PASSWORD}
      APP_VERSION: ${APP_VERSION:-unknown}
    # db:prepare = create + load schema on first run, migrate afterwards.
    # db:init    = create roles, task statuses and the admin user if missing.
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bundle exec rake db:prepare db:init &&
               bundle exec rails s -b 0.0.0.0 -p 3000"
    volumes:
      - student_work:/student-work
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/settings"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  nginx:
    build: ../nginx
    image: ontrack-nginx:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    depends_on:
      api: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      default: {}
      shared:
        aliases:
          - ontrack-${ENV_NAME}

networks:
  shared:
    external: true
    name: ontrack-shared

volumes:
  db_data:
  student_work:
