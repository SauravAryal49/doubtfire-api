# Throwaway test environment: one per test suite per build.
# Used by ci/scripts/run-tests.sh. Env vars mirror OnTrack's own GitHub CI.
services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_USER: dfire
      MARIADB_PASSWORD: pwd
      MARIADB_DATABASE: doubtfire-test
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql            # RAM-backed: faster, nothing left behind
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.0
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 5s
      retries: 15

  tests:
    image: ${IMAGE}
    depends_on:
      mariadb: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      CI: "true"
      RAILS_ENV: test
      DF_STUDENT_WORK_DIR: /student-work
      DF_INSTITUTION_HOST: http://localhost:3000
      DF_INSTITUTION_PRODUCT_NAME: OnTrack
      DF_SECRET_KEY_BASE: test-secret-key-test-secret-key!
      DF_SECRET_KEY_ATTR: test-secret-key-test-secret-key!
      DF_SECRET_KEY_DEVISE: test-secret-key-test-secret-key!
      DF_TEST_DB_ADAPTER: mysql2
      DF_TEST_DB_HOST: mariadb
      DF_TEST_DB_DATABASE: doubtfire-test
      DF_TEST_DB_USERNAME: dfire
      DF_TEST_DB_PASSWORD: pwd
      OVERSEER_ENABLED: "0"
      DF_REDIS_SIDEKIQ_URL: redis://redis:6379/0
