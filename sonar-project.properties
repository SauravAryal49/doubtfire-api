# SonarQube analysis for the OnTrack (Doubtfire) API
sonar.projectKey=ontrack-api
sonar.projectName=OnTrack API (Doubtfire)
sonar.sourceEncoding=UTF-8

sonar.sources=app,lib,config
sonar.tests=test

# Exclusions - generated or third-party code that we don't maintain
#  db/schema.rb, db/migrate : generated by Rails, not hand-written logic
#  vendor, public, node_modules : third-party / static assets
#  config/initializers : framework boilerplate
sonar.exclusions=db/**,vendor/**,public/**,node_modules/**,ci/**,**/*.pdf,**/*.tex
# Don't count these towards coverage (no meaningful logic to unit test)
sonar.coverage.exclusions=config/**,lib/tasks/**,app/views/**,app/mailers/**
# Duplication check ignores migrations and API entity mappers (declarative by design)
sonar.cpd.exclusions=app/api/entities/**

# External reports produced earlier in the pipeline
sonar.ruby.coverage.reportPaths=reports/coverage/coverage.json
sonar.ruby.rubocop.reportPaths=reports/quality/rubocop.json
